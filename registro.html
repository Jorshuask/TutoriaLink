  <main id="contenido" class="contenido" tabindex="-1">
<section class="tarjeta acceso">
  <h1>Crear cuenta</h1>
  <form id="registro">
    <label for="nombreRegistro">Nombre completo <span class="obligatorio">(obligatorio)</span></label>
    <input id="nombreRegistro" name="nombre" maxlength="100" autocomplete="name" required>
    <label for="correoRegistro">Correo electrónico <span class="obligatorio">(obligatorio)</span></label>
    <input id="correoRegistro" name="correo" type="email" autocomplete="email" required>
    <label for="rolRegistro">Tipo de cuenta</label>
    <select id="rolRegistro" name="rol">
      <option value="estudiante">Estudiante</option>
      <option value="tutor">Tutor</option>
    </select>
    <label for="claveRegistro">Contraseña <span class="obligatorio">(obligatorio)</span></label>
    <input id="claveRegistro" name="clave" type="password" autocomplete="new-password" required>
    <label for="confirmarRegistro">Confirmar contraseña <span class="obligatorio">(obligatorio)</span></label>
    <input id="confirmarRegistro" name="confirmar" type="password" autocomplete="new-password" required>
    <button class="btn" type="submit">Crear cuenta</button>
  </form>
  <p class="enlace-registro"><a href="index.html">Volver a iniciar sesión</a></p>
</section>
  </main>
</body>
