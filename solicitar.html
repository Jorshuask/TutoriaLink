  <div id="aviso" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="error" class="mensaje-error" role="alert" aria-atomic="true" tabindex="-1"></div>
  <noscript><p class="mensaje-error">Esta aplicación necesita JavaScript para iniciar sesión y guardar los formularios.</p></noscript>
  <main id="contenido" class="contenido" tabindex="-1">
<h1>Solicitar tutoría</h1>
<p id="resumenTutor"></p>
<form id="solicitar" class="tarjeta formulario">
  <label for="asignatura">Materia <span class="obligatorio">(obligatorio)</span></label>
  <select id="asignatura" name="materia" required></select>
  <label for="fecha">Fecha <span class="obligatorio">(obligatorio)</span></label>
  <input id="fecha" name="fecha" type="date" required aria-describedby="diasAyuda">
  <p id="diasAyuda"></p>
  <label for="turno">Horario <span class="obligatorio">(obligatorio)</span></label>
  <select id="turno" name="hora" required></select>
  <label for="modalidad">Modalidad</label>
  <select id="modalidad" name="modalidad"><option>Virtual</option><option>Presencial</option></select>
  <label for="motivo">Motivo de la tutoría <span class="obligatorio">(obligatorio)</span></label>
  <textarea id="motivo" name="motivo" minlength="10" maxlength="500" required aria-describedby="motivoAyuda"></textarea>
  <p id="motivoAyuda">Escribe entre 10 y 500 caracteres.</p>
  <div class="acciones">
    <button class="btn" type="submit">Enviar solicitud</button>
    <a class="btn sec" href="buscar.html">Cancelar</a>
  </div>
</form>
  </main>
</body>
</html>
