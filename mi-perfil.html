    <!-- Los enlaces se muestran según el rol en sesion.js. -->

      <a href="panel-estudiante.html" data-roles="estudiante">Panel</a>
      <a href="panel-tutor.html" data-roles="tutor">Panel</a>

    </nav>
  </header>
  <div id="aviso" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="error" class="mensaje-error" role="alert" aria-atomic="true" tabindex="-1"></div>
  <noscript><p class="mensaje-error">Esta aplicación necesita JavaScript para iniciar sesión y guardar los formularios.</p></noscript>
  <main id="contenido" class="contenido" tabindex="-1">
<h1 id="tituloPerfil">Mi perfil</h1>
<form id="miPerfil" class="formulario ajustes">
  <section class="seccion-formulario">
    <h2>Datos personales</h2>
    <div class="datos-perfil">
      <div class="campo-perfil">
        <label for="nombrePerfil">Nombre <span class="obligatorio">(obligatorio)</span></label>
        <input id="nombrePerfil" name="nombre" autocomplete="name" maxlength="100" required>
      </div>
      <div class="campo-perfil">
        <label for="correoPerfil">Correo electrónico</label>
        <input id="correoPerfil" type="email" name="correo" autocomplete="email">
      </div>
      <div class="campo-perfil biografia">
        <label for="biografia">Presentación</label>
        <textarea id="biografia" name="bio" maxlength="500"></textarea>
      </div>
    </div>
  </section>
  <fieldset id="seccionMaterias" class="seccion-formulario" hidden>
    <legend>Materias que imparto</legend>
    <p class="nota-campo">Marca al menos una materia en la que puedas ofrecer apoyo.</p>
    <div class="opciones" id="opcionesMaterias"></div>
  </fieldset>
  <div class="pie-formulario"><button class="btn" type="submit">Guardar cambios</button></div>
</form>
  </main>
</body>
</html>
