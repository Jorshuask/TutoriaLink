  <main id="contenido" class="contenido" tabindex="-1">
<h1>Buscar tutor</h1>
<p>Filtra por materia y disponibilidad.</p>
<div class="layout">
  <aside class="tarjeta">
    <h2>Filtros</h2>
    <form id="filtros">
      <label for="materia">Materia</label>
      <select id="materia"><option value="">Todas</option></select>
      <label for="dia">Día</label>
      <select id="dia">
        <option value="">Cualquier día</option>
        <option value="1">Lunes</option><option value="2">Martes</option>
        <option value="3">Miércoles</option><option value="4">Jueves</option>
        <option value="5">Viernes</option><option value="6">Sábado</option>
        <option value="0">Domingo</option>
      </select>
      <label for="hora">Hora</label>
      <select id="hora">
        <option value="">Cualquier hora</option>
        <option>14:00</option><option>15:00</option><option>16:00</option>
        <option>17:00</option><option>18:00</option>
      </select>
      <button class="btn" type="submit">Buscar</button>
    </form>
  </aside>
  <section aria-label="Resultados">
    <p id="cantidad" role="status" aria-live="polite" aria-atomic="true"></p>
    <div id="resultados"></div>
  </section>
</div>
  </main>
